<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#162040" stroke="#D4A847" stroke-width="1.5"/>
  <!-- Graduation cap tassel rope -->
  <line x1="46" y1="20" x2="46" y2="30" stroke="#D4A847" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="46" cy="32" r="2" fill="#D4A847"/>
  <!-- Graduation cap board (mortarboard) -->
  <polygon points="32,14 50,22 32,30 14,22" fill="#D4A847" opacity="0.9"/>
  <rect x="27" y="28" width="10" height="10" rx="1" fill="#D4A847" opacity="0.75"/>
  <!-- Cap top circle -->
  <rect x="29.5" y="19" width="5" height="9" rx="1" fill="#0B1628" opacity="0.5"/>
  <!-- Diploma scroll -->
  <rect x="19" y="34" width="18" height="13" rx="3" fill="#F0C96E" opacity="0.15" stroke="#D4A847" stroke-width="1.2"/>
  <line x1="22" y1="39" x2="34" y2="39" stroke="#D4A847" stroke-width="1" opacity="0.7"/>
  <line x1="22" y1="42" x2="31" y2="42" stroke="#D4A847" stroke-width="1" opacity="0.7"/>
  <!-- Compass needle (pathway symbol) -->
  <circle cx="43" cy="44" r="7" fill="none" stroke="#D4A847" stroke-width="1.2" opacity="0.6"/>
  <line x1="43" y1="38" x2="43" y2="50" stroke="#D4A847" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="37" y1="44" x2="49" y2="44" stroke="#D4A847" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <circle cx="43" cy="44" r="2" fill="#D4A847" opacity="0.9"/>
</svg>
