<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Access Denied — Cyndy Educational Pathways</title>
  <meta name="robots" content="noindex"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .err-wrap {
      text-align:center;
      max-width:460px;
      padding:var(--space-8);
      animation:slideUp 0.5s ease both;
    }
    .err-code {
      font-family:var(--font-display);
      font-size:6rem;
      font-weight:700;
      color:var(--gold);
      line-height:1;
      margin-bottom:var(--space-4);
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .err-icon {
      width:80px;height:80px;
      border-radius:50%;
      background:var(--danger-dim);
      border:2px solid rgba(201,64,64,0.3);
      display:flex;align-items:center;justify-content:center;
      font-size:2rem;color:var(--danger);
      margin:0 auto var(--space-5);
    }
    .err-title { font-family:var(--font-display); font-size:2rem; font-weight:700; margin-bottom:var(--space-3); }
    .err-desc  { color:var(--text-secondary); line-height:1.7; margin-bottom:var(--space-8); }
  </style>
</head>
<body>
  <div class="err-wrap">
    <div class="err-icon"><i class="fa-solid fa-ban"></i></div>
    <div class="err-code">403</div>
    <h1 class="err-title">Access Denied</h1>
    <p class="err-desc">
      You don't have permission to view this page.
      This area is restricted to authorised users only.
    </p>
    <div style="display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap">
      <a href="/" class="btn btn-gold btn-lg" id="unauthorizedHomeBtn">
        <i class="fa-solid fa-house"></i> Go Home
      </a>
      <button class="btn btn-ghost btn-lg" id="unauthorizedBackBtn" onclick="history.back()">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
    </div>
  </div>
</body>
</html>
